services:
  postgres:
    image: postgres:16-alpine
    container_name: aq_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aq_password}
      POSTGRES_DB: ${POSTGRES_DB:-air_quality}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aq_user} -d ${POSTGRES_DB:-air_quality}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: aq_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
