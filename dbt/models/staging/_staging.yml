version: 2

models:
  - name: stg_weather_hourly
    description: Data cuaca yang sudah dibersihkan dan diseragamkan penamaannya.
    columns:
      - name: location_key
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
      - name: variable_name
        tests:
          - not_null
          - accepted_values:
              values: [temperature_2m, relative_humidity_2m, precipitation,
                       wind_speed_10m, wind_direction_10m]
      - name: measurement_domain
        tests:
          - accepted_values:
              values: [weather]

  - name: stg_air_quality_hourly
    description: Data kualitas udara yang sudah dibersihkan.
    columns:
      - name: location_key
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
      - name: variable_name
        tests:
          - not_null
          - accepted_values:
              values: [pm10, pm2_5, carbon_monoxide, nitrogen_dioxide, ozone]
      - name: measurement_domain
        tests:
          - accepted_values:
              values: [air_quality]
