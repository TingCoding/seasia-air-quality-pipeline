version: 2

models:
  - name: stg_weather_hourly
    description: Weather data with consistent column naming and explicit types.
    columns:
      - name: location_key
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
      - name: variable_name
        tests:
          - not_null
          - accepted_values:
              values: [temperature_2m, relative_humidity_2m, precipitation,
                       wind_speed_10m, wind_direction_10m]
      - name: measurement_domain
        tests:
          - accepted_values:
              values: [weather]

  - name: stg_air_quality_hourly
    description: Air quality data with consistent column naming and explicit types.
    columns:
      - name: location_key
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
      - name: variable_name
        tests:
          - not_null
          - accepted_values:
              values: [pm10, pm2_5, carbon_monoxide, nitrogen_dioxide, ozone]
      - name: measurement_domain
        tests:
          - accepted_values:
              values: [air_quality]

  - name: stg_openaq_stations
    description: Station metadata as the API reports it now.
    columns:
      - name: station_id
        tests: [unique, not_null]
      - name: location_key
        tests: [not_null]

  - name: stg_openaq_registry
    description: The committed station registry, with timestamps cast explicitly.
    columns:
      - name: station_id
        tests: [unique, not_null]
      - name: location_key
        tests: [not_null]
      - name: selected_on
        tests: [not_null]
      - name: has_unparseable_dates
        description: >
          True when a registry cell held text that could not be read as a date.
          Surfaced rather than hidden, because the file is edited by hand.

  - name: stg_openaq_measurements
    description: >
      Hourly station measurements with parameter names reconciled against the
      Open-Meteo vocabulary.
    columns:
      - name: sensor_id
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
      - name: variable_name
        tests:
          - not_null
          - accepted_values:
              values: [pm2_5, pm10]
      - name: measurement_unit
        description: Retained per row rather than assumed; providers differ.
