version: 2

sources:
  - name: raw
    description: >
      Raw ingestion output, stored verbatim with no transformation applied.
      dbt reads from here but never writes to it.
    schema: raw
    tables:
      - name: weather_hourly
        description: Hourly weather measurements from the Open-Meteo Archive API.
        columns:
          - name: location_key
            description: Location key, referencing the locations seed.
            tests: [not_null]
          - name: observed_at
            description: Observation timestamp in UTC.
            tests: [not_null]
          - name: variable
            description: Weather variable name, for example temperature_2m.
            tests: [not_null]
          - name: value
            description: Measured value. May be NULL when the source has no data.
          - name: ingested_at
            description: When this row was last loaded.
            tests: [not_null]

      - name: air_quality_hourly
        description: Hourly air quality measurements from the Open-Meteo Air Quality API.
        columns:
          - name: location_key
            tests: [not_null]
          - name: observed_at
            tests: [not_null]
          - name: variable
            tests: [not_null]
          - name: ingested_at
            tests: [not_null]

      - name: openaq_stations
        description: >
          Station metadata as the OpenAQ API reports it now. Distinct from the
          openaq_stations seed, which records what was selected and when.
        columns:
          - name: station_id
            tests: [unique, not_null]
          - name: location_key
            tests: [not_null]

      - name: openaq_sensors
        description: One row per measured parameter at a station.
        columns:
          - name: sensor_id
            tests: [unique, not_null]
          - name: station_id
            tests: [not_null]

      - name: openaq_measurements
        description: >
          Hourly averages from monitoring stations. Unlike the Open-Meteo
          tables, an hour with no reading is an absent row rather than a row
          holding NULL -- the API simply does not return it.
        columns:
          - name: sensor_id
            tests: [not_null]
          - name: observed_at
            tests: [not_null]
          - name: parameter
            tests: [not_null]
          - name: coverage_pct
            description: >
              Share of the underlying readings the hourly mean was built from,
              as reported by OpenAQ.
