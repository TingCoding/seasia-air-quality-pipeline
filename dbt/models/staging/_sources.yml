version: 2

sources:
  - name: raw
    description: >
      Raw ingestion output, stored verbatim with no transformation applied.
      dbt reads from here but never writes to it.
    schema: raw
    tables:
      - name: weather_hourly
        description: Hourly weather measurements from the Open-Meteo Archive API.
        columns:
          - name: location_key
            description: Location key, referencing the locations seed.
            tests: [not_null]
          - name: observed_at
            description: Observation timestamp in UTC.
            tests: [not_null]
          - name: variable
            description: Weather variable name, for example temperature_2m.
            tests: [not_null]
          - name: value
            description: Measured value. May be NULL when the source has no data.
          - name: ingested_at
            description: When this row was last loaded.
            tests: [not_null]

      - name: air_quality_hourly
        description: Hourly air quality measurements from the Open-Meteo Air Quality API.
        columns:
          - name: location_key
            tests: [not_null]
          - name: observed_at
            tests: [not_null]
          - name: variable
            tests: [not_null]
          - name: ingested_at
            tests: [not_null]
