version: 2

models:
  - name: int_measurements_unioned
    description: >
      All measurements from both domains combined into a single long-format
      stream. This is the only input the marts layer reads from.
    columns:
      - name: measurement_key
        description: Surrogate key derived from location, timestamp, variable and source.
        tests: [unique, not_null]
      - name: location_key
        tests: [not_null]
      - name: observed_at
        tests: [not_null]
      - name: measurement_domain
        tests:
          - accepted_values:
              values: [weather, air_quality]
