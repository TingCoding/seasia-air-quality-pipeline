version: 2

models:
  - name: dim_location
    description: Location dimension with geographic metadata and timezone.
    columns:
      - name: location_key
        description: Primary key for a location.
        tests: [unique, not_null]
      - name: city
        tests: [not_null]
      - name: timezone
        description: IANA timezone name, used to derive local time in the fact table.
        tests: [not_null]
      - name: has_measurements
        description: Whether any measurements have actually been collected for this location.

  - name: dim_date
    description: Date dimension, built from the range of data present.
    columns:
      - name: date_day
        tests: [unique, not_null]
      - name: day_of_week
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6, 7]
              quote: false

  - name: fct_hourly_measurement
    description: >
      The central fact table. One row is one measurement at one location, one
      hour, one variable, from one source.
    columns:
      - name: measurement_key
        tests: [unique, not_null]
      - name: location_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_key
      - name: date_day
        tests:
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: observed_at
        tests: [not_null]
      - name: measurement_value
        description: May be NULL. Absence of a value is flagged by is_missing.
      - name: is_missing
        tests: [not_null]

  - name: agg_daily_air_quality
    description: Daily pollutant summary per city, including how complete each average is.
    columns:
      - name: measurement_completeness_pct
        description: Share of hours in the day that actually carry a value.
